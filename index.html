<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />

  <title>Zyraa Kitchens | Premium Cloud Kitchen Network | Bengaluru</title>
  <meta name="description" content="Zyraa Kitchens operates a state-of-the-art network of cloud kitchens across Bengaluru. Experience restaurant-quality culinary craft delivered in under 30 minutes." />
  <meta name="keywords" content="Zyraa Kitchens, Cloud Kitchen Bengaluru, Pind Da Chulha, Wok and Roll, The Clean Bowl, Midnight Craves, Food Delivery Bangalore" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./assets/images/logo.png" />

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              charcoal: '#111827', // Dark Slate Charcoal
              darker: '#0B0F19',
              amber: '#F59E0B',   // Warm Saffron/Amber
              amberLight: '#FBBF24',
              amberDark: '#D97706',
              offwhite: '#F9FAFB', // Light off-white
              cardBorder: '#E5E7EB',
              muted: '#6B7280'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Outfit"', 'sans-serif']
          },
          boxShadow: {
            'amber-glow': '0 4px 20px -2px rgba(245, 158, 11, 0.35)',
            'amber-glow-lg': '0 10px 30px -3px rgba(245, 158, 11, 0.45)',
            'card-lift': '0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04)',
            'drawer': '-10px 0 35px -5px rgba(0, 0, 0, 0.4)'
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM Production CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for in-browser compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Custom Styles for Ultra-High Fidelity Aesthetics -->
  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #111827;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #F59E0B;
    }

    /* Glassmorphism Header */
    .glass-header {
      background: rgba(17, 24, 39, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* Glassmorphism Pill */
    .glass-pill {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* Image shimmer placeholder */
    .img-zoom-container {
      overflow: hidden;
    }
    .img-zoom-container img {
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dish-card:hover .img-zoom-container img {
      transform: scale(1.08);
    }

    /* Pulsing kitchen live dot */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 0; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-indicator {
      position: relative;
    }
    .pulse-indicator::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      border-radius: 9999px;
      background-color: #10B981;
      animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
    }

    /* Cart Drawer Slide animation */
    .cart-drawer-transition {
      transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Floating Cart Badge Pop */
    @keyframes badge-pop {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
    .animate-badge-pop {
      animation: badge-pop 0.3s ease-out;
    }
  </style>
</head>
<body class="bg-brand-offwhite text-gray-800 font-sans antialiased selection:bg-brand-amber selection:text-white min-h-screen flex flex-col">

  <!-- React Mount Point -->
  <div id="root"></div>

  <!-- React Application Source -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // EXACT MOCK DATA REQUIRED BY SPECIFICATION
    const MENU_ITEMS = [
      {
        id: 1,

        dish: "Premium Butter Chicken Meal",
        price: 289,
        desc: "Rich tomato-cashew gravy, tender tandoori chicken, served with 2 butter naans.",

      },
      {

        price: 249,
        desc: "Wok-tossed street style noodles with fresh veggies and Sichuan peppers.",
        image: "assets/images/chilli_garlic_noodles.jpg",
        isVeg: true,

        rating: "4.8",

      {

        image: "assets/images/avocado_quinoa_salad.jpg",
        isVeg: true,

        rating: "4.9",
        prepTime: "15 mins",
        calories: "380 kcal"
      },
      {
        id: 4,
        brand: "Midnight Craves",
        category: "Desserts & Late Night",
        dish: "Smoked Hickory Bacon Burger",
        price: 279,
        desc: "Char-grilled patty, cheddar cheese, crispy bacon, house BBQ sauce.",
        image: "assets/images/smoked_bacon_burger.jpg",
        isVeg: false,
        tag: "Late Night Fav",
        rating: "4.7",
        prepTime: "20 mins",
        calories: "740 kcal"
      },
      {
        id: 5,
        brand: "Wok & Roll",
        category: "Pan-Asian",
        dish: "Steamed Chicken Dim Sums",
        price: 199,
        desc: "6 pieces of handmade juicy dumplings served with hot chili oil dip.",
        image: "assets/images/chicken_dim_sums.jpg",
        isVeg: false,
        tag: "Handmade",
        rating: "4.9",
        prepTime: "16 mins",
        calories: "340 kcal"
      },
      {
        id: 6,
        brand: "Pind Da Chulha",
        category: "North Indian",
        dish: "Dal Makhani & Rice Combo",
        price: 229,
        desc: "Slow-cooked black lentils finished with fresh cream and butter, paired with basmati rice.",
        image: "assets/images/dal_makhani_combo.jpg",
        isVeg: true,
        tag: "Comfort Classic",
        rating: "4.8",
        prepTime: "20 mins",
        calories: "590 kcal"
      }
    ];

    const FILTER_CATEGORIES = [
      "All Brands",
      "North Indian",
      "Pan-Asian",
      "Healthy",
      "Desserts & Late Night"
    ];

    // Popular Bengaluru Delivery Areas for quick testing
    const BENGALURU_HUBS = [
      { name: "Koramangala", eta: "22 mins", status: "Active High-Speed Hub" },
      { name: "Indiranagar", eta: "25 mins", status: "Active High-Speed Hub" },
      { name: "HSR Layout", eta: "19 mins", status: "Main Cloud Kitchen #1" },
      { name: "Whitefield", eta: "28 mins", status: "East Tech Hub Active" },
      { name: "JP Nagar", eta: "24 mins", status: "South Hub Active" }
    ];

    function App() {
      // Core Interactive States specified in instructions
      const [cartItems, setCartItems] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [activeFilter, setActiveFilter] = useState("All Brands");
      
      // UX polish states
      const [locationInput, setLocationInput] = useState("");
      const [detectedLocation, setDetectedLocation] = useState("Bengaluru Urban, KA");
      const [locationFeedback, setLocationFeedback] = useState(null);
      const [toast, setToast] = useState(null);
      const [isCheckoutModalOpen, setIsCheckoutModalOpen] = useState(false);
      const [orderStage, setOrderStage] = useState(0); // 0: Review, 1: Cooking, 2: Dispatched
      const [badgeAnimate, setBadgeAnimate] = useState(false);

      // Total items count live calculation
      const totalItemCount = useMemo(() => {
        return cartItems.reduce((acc, item) => acc + item.quantity, 0);
      }, [cartItems]);

      // Item Total Calculation
      const itemTotal = useMemo(() => {
        return cartItems.reduce((acc, item) => acc + (item.price * item.quantity), 0);
      }, [cartItems]);

      // Statutory fixed calculations per specification
      const deliveryFee = totalItemCount > 0 ? 30 : 0;
      const taxes = totalItemCount > 0 ? 22 : 0;
      const grandTotal = totalItemCount > 0 ? itemTotal + deliveryFee + taxes : 0;

      // Trigger micro-toast
      const showToast = (message, icon = "bi-check-circle-fill") => {
        setToast({ message, icon });
        setTimeout(() => setToast(null), 3000);
      };

      // Add to Cart
      const addToCart = (dish) => {
        setCartItems(prev => {
          const existing = prev.find(item => item.id === dish.id);
          if (existing) {
            return prev.map(item =>
              item.id === dish.id ? { ...item, quantity: item.quantity + 1 } : item
            );
          } else {
            return [...prev, { ...dish, quantity: 1 }];
          }
        });
        setBadgeAnimate(true);
        setTimeout(() => setBadgeAnimate(false), 400);
        showToast(`Added "${dish.dish}" to cart!`, "bi-bag-plus-fill");
        // Open drawer on first add or action
        setIsCartOpen(true);
      };

      // Update quantity (+ or -)
      const updateQuantity = (id, delta) => {
        setCartItems(prev => {
          return prev.map(item => {
            if (item.id === id) {
              const newQty = item.quantity + delta;
              return newQty > 0 ? { ...item, quantity: newQty } : null;
            }
            return item;
          }).filter(Boolean);
        });
      };

      // Remove single item completely
      const removeItem = (id) => {
        setCartItems(prev => prev.filter(item => item.id !== id));
        showToast("Item removed from order", "bi-trash");
      };

      // Clear all items
      const clearCart = () => {
        setCartItems([]);
        showToast("Cart cleared", "bi-cart-x");
      };

      // Location Search Simulation
      const handleLocationSearch = (e) => {
        if (e) e.preventDefault();
        const query = locationInput.trim();
        if (!query) {
          setLocationFeedback({
            type: "error",
            text: "Please enter your locality in Bengaluru (e.g. Koramangala, Indiranagar)."
          });
          return;
        }

        // Simulate instant cloud kitchen hub matching
        const matched = BENGALURU_HUBS.find(h => h.name.toLowerCase().includes(query.toLowerCase()));
        if (matched) {
          setDetectedLocation(`${matched.name}, Bengaluru`);
          setLocationFeedback({
            type: "success",
            text: `⚡ Verified! Zyraa Hub serving ${matched.name} in ~${matched.eta}. Kitchen status: Optimal.`
          });
          showToast(`Hub Connected: ${matched.name} (~${matched.eta})`, "bi-lightning-charge-fill");
        } else {
          setDetectedLocation(`${query}, Bengaluru Urban`);
          setLocationFeedback({
            type: "success",
            text: `⚡ Express Cloud Kitchen coverage active for ${query}. Estimated delivery: 25-30 mins.`
          });
          showToast(`Delivery route mapped to ${query}!`, "bi-geo-alt-fill");
        }

        // Smooth scroll to menu
        setTimeout(() => {
          const menuElem = document.getElementById("menu-section");
          if (menuElem) menuElem.scrollIntoView({ behavior: "smooth" });
        }, 600);
      };

      // Pick quick locality chip
      const selectQuickLocation = (loc) => {
        setLocationInput(loc.name);
        setDetectedLocation(`${loc.name}, Bengaluru`);
        setLocationFeedback({
          type: "success",
          text: `⚡ Linked to ${loc.name} Hub! Current average turnaround: ${loc.eta}.`
        });
        showToast(`Selected ${loc.name} Hub`, "bi-check2-circle");
        const menuElem = document.getElementById("menu-section");
        if (menuElem) menuElem.scrollIntoView({ behavior: "smooth" });
      };

      // Simulate Checkout Flow
      const handleProceedToCheckout = () => {
        if (cartItems.length === 0) {
          showToast("Your cart is empty!", "bi-exclamation-triangle-fill");
          return;
        }
        setIsCartOpen(false);
        setIsCheckoutModalOpen(true);
        setOrderStage(0);
      };

      // Order confirmation simulation
      const confirmOrderSimulation = () => {
        setOrderStage(1);
        setTimeout(() => {
          setOrderStage(2);
          showToast("Order dispatched by Zyraa Express Rider!", "bi-scooter");
        }, 2200);
      };

      // Filtered Menu Items
      const filteredMenu = useMemo(() => {
        if (activeFilter === "All Brands") return MENU_ITEMS;
        return MENU_ITEMS.filter(item => item.category === activeFilter);
      }, [activeFilter]);

      return (
        <div className="relative min-h-screen flex flex-col bg-brand-offwhite">

          {/* ========================================================
              COMPONENT 1: NAVIGATION HEADER (Sticky & Glassmorphism)
              ======================================================== */}
          <header className="sticky top-0 z-40 w-full glass-header border-b border-gray-800/80 shadow-lg transition-all duration-300">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
              
              {/* Left: Brand Logo */}
              <div className="flex items-center space-x-4 cursor-pointer" onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}>
                <div className="bg-white rounded-xl p-1.5 shadow-md flex items-center justify-center h-14 w-auto">
                  <img src="./assets/images/logo.png" alt="Zyraa Kitchens" className="h-full w-auto object-contain" />
                </div>
                <div className="flex flex-col justify-center mt-1">
                  <span className="text-[10px] uppercase tracking-widest font-semibold text-gray-400 flex items-center gap-1.5">
                    REG <span className="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                    <span className="text-gray-500 font-mono text-[9px]">ACZ-5345</span>
                  </span>
                </div>
              </div>

              {/* Center: Location Pill */}
              <div className="hidden md:flex items-center">
                <div className="glass-pill px-4 py-2 rounded-full flex items-center space-x-2 text-sm text-gray-200 border border-gray-700/60 shadow-inner group hover:border-brand-amber/50 transition-all duration-300">
                  <span className="text-brand-amber text-base animate-bounce">📍</span>
                  <span className="font-medium tracking-wide text-gray-100">{detectedLocation}</span>
                  <span className="w-2 h-2 rounded-full bg-emerald-400 pulse-indicator ml-1.5" title="Kitchen Network Online"></span>
                  <span className="text-xs text-emerald-400 font-semibold tracking-wide ml-0.5">Live</span>
                </div>
              </div>

              {/* Right: Floating Cart Button */}
              <div className="flex items-center space-x-3">
                <button
                  id="header-cart-btn"
                  onClick={() => setIsCartOpen(true)}
                  className="relative flex items-center space-x-2.5 bg-gradient-to-r from-brand-amber to-amber-600 hover:from-amber-500 hover:to-amber-700 text-gray-900 font-bold px-4 sm:px-5 py-2.5 rounded-xl shadow-amber-glow hover:shadow-amber-glow-lg transition-all duration-300 ease-in-out transform hover:-translate-y-0.5 active:translate-y-0"
                  aria-label="Open Shopping Cart Drawer"
                >
                  <i className="bi bi-cart3 text-lg font-bold text-gray-950"></i>
                  <span className="hidden sm:inline text-sm font-extrabold tracking-wide uppercase text-gray-950">Cart</span>
                  <span 
                    className={`inline-flex items-center justify-center px-2.5 py-0.5 text-xs font-black text-white bg-gray-950 rounded-full transition-transform ${badgeAnimate ? 'animate-badge-pop scale-125' : ''}`}
                  >
                    {totalItemCount}
                  </span>
                </button>
              </div>

            </div>

            {/* Mobile Location Bar */}
            <div className="md:hidden px-4 py-1.5 bg-gray-950/80 border-t border-gray-800 flex items-center justify-between text-xs text-gray-300">
              <div className="flex items-center space-x-1.5 truncate">
                <span className="text-brand-amber">📍</span>
                <span className="truncate">{detectedLocation}</span>
              </div>
              <div className="flex items-center space-x-1 text-emerald-400 font-semibold shrink-0">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-indicator"></span>
                <span>30 Mins ETA</span>
              </div>
            </div>
          </header>


          {/* ========================================================
              COMPONENT 2: HERO SECTION
              ======================================================== */}
          <section className="relative w-full bg-brand-charcoal text-white overflow-hidden">
            {/* Background Image with culinary atmospheric dark gradient overlay */}
            <div className="absolute inset-0 z-0">
              <img 
                src="assets/images/hero_culinary_bg.jpg" 
                alt="Zyraa Cloud Kitchen Gourmet Cooking" 
                className="w-full h-full object-cover object-center opacity-30 mix-blend-luminosity scale-105 transition-transform duration-1000"
              />
              <div className="absolute inset-0 bg-gradient-to-t from-brand-charcoal via-brand-charcoal/85 to-brand-charcoal/60"></div>
              <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-amber-500/10 via-transparent to-transparent"></div>
            </div>

            <div className="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-16 sm:pt-24 pb-20 sm:pb-28">
              <div className="max-w-3xl">
                
                {/* Modern Pill Badge */}
                <div className="inline-flex items-center space-x-2 px-3.5 py-1.5 rounded-full bg-brand-amber/15 border border-brand-amber/30 text-brand-amber text-xs sm:text-sm font-semibold mb-6 backdrop-blur-md">
                  <span className="flex h-2 w-2 relative">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-amber opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-2 w-2 bg-brand-amber"></span>
                  </span>
                  <span>Bengaluru's Premier Culinary Tech Cloud Grid</span>
                </div>

                {/* Main Headline */}
                <h1 className="font-display font-extrabold text-3xl sm:text-5xl lg:text-6xl text-white tracking-tight leading-[1.15] mb-6">
                  The Future of Flavor, <br className="hidden sm:block"/>
                  <span className="text-transparent bg-clip-text bg-gradient-to-r from-brand-amber via-amber-400 to-yellow-200">
                    Delivered to Your Doorstep.
                  </span>
                </h1>

                {/* Sub-headline */}
                <p className="text-base sm:text-lg lg:text-xl text-gray-300 leading-relaxed font-normal mb-8 max-w-2xl">
                  Zyraa Kitchens operates a state-of-the-art network of cloud kitchens across Bengaluru. We blend culinary tech with authentic recipes to deliver restaurant-quality meals in under 30 minutes.
                </p>

                {/* Search Component: Delivery Location Check */}
                <div className="w-full max-w-2xl bg-gray-900/90 p-2 sm:p-2.5 rounded-2xl border border-gray-700/80 shadow-2xl backdrop-blur-xl mb-4">
                  <form onSubmit={handleLocationSearch} className="flex flex-col sm:flex-row gap-2 sm:gap-3">
                    <div className="relative flex-1 flex items-center">
                      <i className="bi bi-geo-alt text-brand-amber text-xl absolute left-3.5"></i>
                      <input
                        type="text"
                        value={locationInput}
                        onChange={(e) => setLocationInput(e.target.value)}
                        placeholder="Enter your Bengaluru delivery area..."
                        className="w-full pl-11 pr-4 py-3 bg-gray-800/80 text-white placeholder-gray-400 text-sm sm:text-base rounded-xl border border-gray-700 focus:outline-none focus:border-brand-amber focus:ring-1 focus:ring-brand-amber transition-all"
                      />
                    </div>
                    <button
                      type="submit"
                      className="bg-brand-amber hover:bg-amber-500 text-gray-950 font-bold px-6 py-3 rounded-xl shadow-amber-glow hover:shadow-amber-glow-lg transition-all duration-300 text-sm sm:text-base flex items-center justify-center space-x-2 shrink-0"
                    >
                      <i className="bi bi-search"></i>
                      <span>Find Food</span>
                    </button>
                  </form>
                </div>

                {/* Live Location Feedback Banner */}
                {locationFeedback && (
                  <div className={`p-3 rounded-xl mb-6 text-sm font-medium flex items-center space-x-2 ${
                    locationFeedback.type === 'success' ? 'bg-emerald-950/80 border border-emerald-700 text-emerald-300' : 'bg-rose-950/80 border border-rose-700 text-rose-300'
                  }`}>
                    <i className={locationFeedback.type === 'success' ? 'bi bi-check-circle-fill text-emerald-400' : 'bi bi-exclamation-circle-fill text-rose-400'}></i>
                    <span>{locationFeedback.text}</span>
                  </div>
                )}

                {/* Quick Locality Chips */}
                <div className="flex flex-wrap items-center gap-2 mb-8 text-xs text-gray-400">
                  <span className="font-semibold text-gray-300 flex items-center gap-1">
                    <i className="bi bi-pin-map text-brand-amber"></i> Quick Select:
                  </span>
                  {BENGALURU_HUBS.map(hub => (
                    <button
                      key={hub.name}
                      onClick={() => selectQuickLocation(hub)}
                      className="px-2.5 py-1 rounded-lg bg-gray-800/80 hover:bg-gray-700 text-gray-300 hover:text-white border border-gray-700/60 transition-colors"
                    >
                      {hub.name}
                    </button>
                  ))}
                </div>

                {/* Badges below input */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 pt-2 border-t border-gray-800/80">
                  <div className="flex items-center space-x-2.5 text-gray-300 bg-gray-800/40 px-3.5 py-2.5 rounded-xl border border-gray-800">
                    <span className="text-xl">⚡</span>
                    <span className="text-sm font-semibold tracking-wide">30 Mins Delivery</span>
                  </div>
                  <div className="flex items-center space-x-2.5 text-gray-300 bg-gray-800/40 px-3.5 py-2.5 rounded-xl border border-gray-800">
                    <span className="text-xl">🍃</span>
                    <span className="text-sm font-semibold tracking-wide">FSSAI Certified Hygiene</span>
                  </div>
                  <div className="flex items-center space-x-2.5 text-gray-300 bg-gray-800/40 px-3.5 py-2.5 rounded-xl border border-gray-800">
                    <span className="text-xl">🍳</span>
                    <span className="text-sm font-semibold tracking-wide">Cloud Tech Powered</span>
                  </div>
                </div>

              </div>
            </div>
          </section>


          {/* ========================================================
              COMPONENT 3: DYNAMIC BRAND & MENU SELECTOR
              ======================================================== */}
          <section id="menu-section" className="w-full py-16 sm:py-24 bg-brand-offwhite">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

                      <li><span className="hover:text-gray-300">Brand Cloud Onboarding</span></li>
                      <li><span className="hover:text-gray-300">Corporate Catering</span></li>
                      <li><span className="hover:text-gray-300">Culinary Careers</span></li>
                    </ul>
                  </div>

                  {/* Col 4 */}
                  <div>
                    <h4 className="font-display font-bold text-xs uppercase tracking-wider text-white mb-4">
                      Investor Relations
                    </h4>
                    <ul className="space-y-2.5 text-xs text-gray-400">
                      <li><span className="hover:text-gray-300">Corporate Governance</span></li>
                      <li><span className="hover:text-gray-300">Growth Roadmaps</span></li>
                      <li><span className="hover:text-gray-300">Tech Stack Whitepaper</span></li>
                      <li><span className="hover:text-gray-300">Press & Media Kit</span></li>
                    </ul>
                  </div>

                </div>

              </div>

              {/* Copyright Line */}
              <div className="pt-8 flex flex-col sm:flex-row items-center justify-between text-xs text-gray-400 gap-4">
                <p>
                  © 2026 Zyraa Kitchens. All rights reserved. Conceptual Demo Application.
                </p>
                <div className="flex items-center space-x-6 text-gray-400">
                  <span className="hover:text-gray-300 cursor-pointer">Privacy Policy</span>
                  <span className="hover:text-gray-300 cursor-pointer">Terms of Service</span>
                  <span className="hover:text-gray-300 cursor-pointer">Food Safety Policy</span>
                </div>
              </div>

            </div>
          </footer>


          {/* ========================================================
              INTERACTIVE ORDER CONFIRMATION MODAL (CHECKOUT SIMULATOR)
              ======================================================== */}
          {isCheckoutModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gray-950/80 backdrop-blur-md">
              <div className="bg-brand-charcoal border border-gray-700 w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col text-white">
                
                {/* Modal Header */}
                <div className="p-5 border-b border-gray-800 flex items-center justify-between bg-gray-900/90">
                  <div className="flex items-center space-x-2.5">
                    <span className="text-xl">🚀</span>
                    <h3 className="font-display font-bold text-lg text-white">Zyraa Instant Order Simulation</h3>
                  </div>
                  <button
                    onClick={() => setIsCheckoutModalOpen(false)}
                    className="w-8 h-8 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-400 hover:text-white flex items-center justify-center"
                  >
                    <i className="bi bi-x-lg"></i>
                  </button>
                </div>

                {/* Modal Content */}
                <div className="p-6 space-y-6">
                  {orderStage === 0 && (
                    <>
                      <div className="bg-gray-900/80 rounded-xl p-4 border border-gray-800">
                        <div className="text-xs uppercase font-bold text-gray-400 mb-2">Delivery Destination</div>
                        <div className="flex items-center text-sm font-semibold text-white">
                          <i className="bi bi-geo-alt-fill text-brand-amber mr-2"></i>
                          <span>{detectedLocation}</span>
                        </div>
                        <div className="text-xs text-gray-400 mt-1">
                          Assigned Hub: <strong className="text-emerald-400">Zyraa Urban Cloud Kitchen #02</strong>
                        </div>
                      </div>

                      {/* Items Mini-list */}
                      <div>
                        <div className="text-xs uppercase font-bold text-gray-400 mb-2">Order Summary ({totalItemCount} items)</div>
                        <div className="max-h-36 overflow-y-auto space-y-2 pr-1">
                          {cartItems.map(item => (
                            <div key={item.id} className="flex justify-between text-xs py-1 border-b border-gray-800">
                              <span className="text-gray-300">{item.dish} <strong className="text-white">× {item.quantity}</strong></span>
                              <span className="text-brand-amber font-mono font-bold">₹{item.price * item.quantity}</span>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Final Total */}
                      <div className="bg-gray-800/60 p-3 rounded-xl flex justify-between items-center text-sm">
                        <span className="font-semibold text-gray-300">Grand Total Payable</span>
                        <span className="font-display font-extrabold text-xl text-brand-amber">₹{grandTotal}</span>
                      </div>

                      <button
                        onClick={confirmOrderSimulation}
                        className="w-full bg-brand-amber hover:bg-amber-500 text-gray-950 font-display font-bold py-3.5 rounded-xl shadow-amber-glow transition-all flex items-center justify-center space-x-2"
                      >
                        <i className="bi bi-check2-circle text-lg"></i>
                        <span>Confirm & Simulate Kitchen Dispatch</span>
                      </button>
                    </>
                  )}

                  {orderStage === 1 && (
                    <div className="py-8 text-center space-y-4">
                      <div className="w-16 h-16 border-4 border-brand-amber border-t-transparent rounded-full animate-spin mx-auto"></div>
                      <h4 className="font-display font-bold text-xl text-white">Connecting to Bengaluru Cloud Kitchen...</h4>
                      <p className="text-sm text-gray-400 max-w-xs mx-auto">
                        Automated ticket generated at Zyraa Kitchen station. Chef receiving order specs.
                      </p>
                    </div>
                  )}

                  {orderStage === 2 && (
                    <div className="space-y-6">
                      <div className="text-center">
                        <div className="w-14 h-14 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center text-2xl mx-auto mb-3">
                          <i className="bi bi-check-lg"></i>
                        </div>
                        <h4 className="font-display font-bold text-xl text-white">Order Confirmed & Sizzling!</h4>
                        <p className="text-xs text-gray-400 mt-1">Order ID: <strong className="font-mono text-brand-amber">#ZYR-2026-BLR-892</strong></p>
                      </div>

                      {/* Live Tracker Stages */}
                      <div className="space-y-4 bg-gray-900/90 p-4 rounded-xl border border-gray-800 text-xs">
                        <div className="flex items-center space-x-3 text-emerald-400 font-semibold">
                          <i className="bi bi-check-circle-fill text-sm"></i>
                          <span>1. Order Received & FSSAI Sanitisation Checked</span>
                        </div>
                        <div className="flex items-center space-x-3 text-brand-amber font-semibold animate-pulse">
                          <i className="bi bi-fire text-sm"></i>
                          <span>2. Fresh Culinary Wok & Tandoor Preparation In-Progress</span>
                        </div>
                        <div className="flex items-center space-x-3 text-gray-400">
                          <i className="bi bi-circle text-sm"></i>
                          <span>3. Thermal Multi-Layer Insulation Packaging</span>
                        </div>
                        <div className="flex items-center space-x-3 text-gray-400">
                          <i className="bi bi-circle text-sm"></i>
                          <span>4. Rider En-Route to {detectedLocation} (~22 mins)</span>
                        </div>
                      </div>

                      <button
                        onClick={() => {
                          setIsCheckoutModalOpen(false);
                          clearCart();
                          showToast("Simulation Complete! Cart reset for testing.", "bi-stars");
                        }}
                        className="w-full bg-gray-800 hover:bg-gray-700 text-white font-bold py-3 rounded-xl transition-all"
                      >
                        Close & Start Fresh Simulation
                      </button>
                    </div>
                  )}
                </div>

              </div>
            </div>
          )}


          {/* ========================================================
              FLOATING TOAST NOTIFICATION
              ======================================================== */}
          {toast && (
            <div className="fixed bottom-6 right-6 z-50 bg-gray-900 text-white border border-brand-amber/40 shadow-2xl px-4 py-3 rounded-xl flex items-center space-x-3 text-sm animate-bounce">
              <i className={`bi ${toast.icon} text-brand-amber text-lg`}></i>
              <span className="font-medium">{toast.message}</span>
            </div>
          )}

        </div>
      );
    }

    // Render React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
